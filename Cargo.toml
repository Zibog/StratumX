eframe = "0.31.1"
egui = "0.31.1"
wgpu = "24.0"
glam = { version = "0.30", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
bincode = "1.3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
bitflags = { version = "2.6", features = ["serde"] }
slotmap = "1.0"
proptest = "1.5"
clap = "4.0"

