name: ci

on:
  pull_request:
  push:
    branches: ["master", "main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Verify
        run: bash tools/verify.sh

      - name: Smoke
        run: bash tools/smoke.sh

      - name: Full quality
        run: bash tools/full.sh

      - name: Metrics
        run: bash tools/metrics.sh

      - name: Evidence
        run: bash tools/evidence.sh

      - name: Upload generated quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stratumx-quality-artifacts
          path: 7.quality/data/generated/
